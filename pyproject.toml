[project]
name = "rl-for-prnn"
version = "0.1.0"
description = "pRNN embodied by curiosity-driven RL agents"
readme = "README.md"
requires-python = ">=3.10, <=3.10.15"
license = "MIT"
authors = [
    { name = "Daniel Levenstein", email = "daniel.levenstein@mila.quebec" },
    { name = "Adel Halawa", email = "adel.halawa@mila.quebec" },
    { name = "Sabrina Du", email = "sabrina.du@mila.quebec"},
]

dependencies = [
    "gymnasium==0.29.1",
    "ratinabox==1.7.1",
    "pynapple==0.6.1",
    "numpy>=1.22.4",
    "scipy>=1.12.0",
    "pandas>=1.5.3",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.5.3",
    "ruamel.yaml>=0.18.6",
    "torch>=2.7.1",
    "torchvision>=0.20.1",
    "gym>=0.26.2",
    "importlib-metadata>=7.0.1",
    "pyparsing>=3.1.1",
    "zipp>=3.17.0",
    "hydra-core>=1.3.2",
    "torch-ac>=1.4.0",
    "plotly>=6.3.0",
    "jaxtyping>=0.2.36",
    "moviepy>=2.2.1",
    "kaleido>=1.1.0",
    "ultraplot>=1.0.3",
    "ipykernel>=6.31.0",
    "tyro>=1.0.4",
    "pyarrow>=21.0.0",
    "nbformat>=5.10.4",
    "pypatree>=0.4.0",
    "wandb==0.28.0",
    "minigrid",
    "prnn",
]

[dependency-groups]
dev = [
    "rust-just>=1.42.4",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `tasks/` is gone: the Object Memory Task moved to the questions repo
# (../curious-george-questions, src/omt/) on 2026-08-25, with its bitwise
# golden, and passes there against the same fixture.
packages = ["curious_george"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["curious_george", "test*"]
python_files = ["test_*.py", "test.py"]
python_functions = ["test_*"]
addopts = "--durations=5 -m 'not slow'"
pythonpath = ["."]
filterwarnings = [
    "ignore::UserWarning:gymnasium.utils.passive_env_checker",
    "ignore::UserWarning:gymnasium.envs.registration",
    "ignore::UserWarning:gymnasium.core",
    "ignore:::pydantic",
]
markers = ["slow: marks tests as slow to run"]

[tool.ruff]
include = [
    "pyproject.toml",
    # RECURSIVE. `curious_george/*.py` matched only the top level, so every
    # subpackage - rl/, envs/, evaluation/, training/, world_model/, utils/ -
    # was unlinted. The two entries dropped here were dead: `test/*.py` names a
    # directory that is `tests/`, and `trainRL_Adel.py` no longer exists.
    "curious_george/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "main_train.py",
]

[tool.ruff.lint]
# jaxtyping shape annotations - Float[Tensor, "B T H"] - read as forward
# references to ruff, so it reports F722 (syntax error in forward annotation)
# and F821 (undefined name) on every one. 41 of the 103 findings the widened
# `include` surfaced were these. ../curious-george-questions carries the same
# two ignores for the same reason.
ignore = ["F722", "F821"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["curious_george", "tests", "scripts", "*.py"]

# OVerride specific rules
reportPossiblyUnboundVariable = "none"

[tool.uv.sources]
minigrid = { git = "https://github.com/SabrinaDu7/minigrid.git" }
prnn = { git = "ssh://git@github.com/LevensteinLab/pRNN.git", branch = "sdu/rl-integration" }

[project.urls]
Homepage = "https://github.com/SabrinaDu7/RL_for_pRNN.git"
