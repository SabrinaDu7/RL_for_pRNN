defaults:
    - _self_

room_type_green: "dot" # Options: "line", "plus", "dot", "goal"
new_obj_loc: [7, 2]
control: False # If True, train curious agent in env without novel object to see visitation.

training:
    num_trajs: 3000 # trajectories to train on in novel env
    saving_interval_trajs: 200 # TRAJECTORIES between checkpoint saves (converted to batches in task.py, so it does not drift if rl.trajs_per_batch changes)
    analysis_interval: 25 # batches between logging
    lr_trials: 2
    lrgroups: [0, 1, 2]

testing:
    trajs: 8 # trajectories to inspect for test trial. Must be smaller than or equal to trajs_per_batch in training for now
    ctrl_locs: [[2, 5], [4, 7], [11, 3], [13, 5]]
    whichPhase: 0 # which phase to analyze in quantifyObjectLearning
    start_random: False
    batched: False # Batched eval collection (one env copy per test trajectory; not bit-comparable to serial)
    start_up_bound: [12, 6] # [8, 14] for away
    start_low_bound: [1, 1] # [1, 7] for away

analysis:
    objLearning_fig: True
    traj_fig: True
    occupancy: True

otc:
    presence_prob: 0.5 # P(a given training env has the object) - re-rolled each batch. 1.0 == the OMT exposure
    random_position: False # re-sample the object's cell every batch, so position stops predicting WHERE it is
    colors: ["green"] # Scenario A: >1 colour = object IDENTITY re-rolled per episode at a fixed location
    wd_trials: null # Scenario D: per-group weight-decay multiplier during exposure (null = leave alone)
