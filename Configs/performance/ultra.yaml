# @package _global_
#
# Measured high-throughput preset for static L-room pRNN training.
# Usage:
#   ... performance=ultra
#
# Device transition/formatting is trajectory-equivalent to the CPU table path
# (tests/test_device_collector.py). The pooled world-model step, rollout size,
# and optimizer settings intentionally change training semantics. This is a
# fast local starting point, not a claim of scientific equivalence.

exp:
    num_envs: 1024
    device_env: True

predNet:
    batched_wm: True
    batched_curiosity: True

rl:
    frames: 262144 # num_envs * one 256-step segment
    ppo_batch_size: 131072 # 2 minibatches/epoch, 8 Adam steps/update
    lr: 1e-3
    optim_betas: [0.8, 0.97]
    entropy_coef: 0.01
