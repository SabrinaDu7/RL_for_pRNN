# @package predNet
path: no_path/thcycRNN_5win_full-theta-s8
foder: ''
hiddensize: 500
pRNNtype: thRNN_5win
action_encoding: SpeedHD # pairs with pastSR nets (current HD)
lr: 3e-3
bptttrunc: 1e8
weight_decay: 3e-3
ntimescale: 2
dropout: 0.15
noisemean: 0
noisestd: 0.05
sparsity: 0.5
train: True # Train pRNN simultaneously with RL?
seqdur: 256 # Only relevant if train is on
batched_wm: False # One pooled gradient step over all rollout segments stacked (B, L) instead of B sequential steps. Optimization-semantics change: curve-gate before enabling by default
cuda_graph: False # CUDA-graph the per-segment world-model trainStep (fwd+bwd+RMSprop). Keeps B sequential steps (same dynamics as serial), CUDA-only; requires a fresh run (empty optimizer state)
batched_curiosity: False # One batched inference pass for equal-length segments; changes dropout/noise RNG ordering, intended for high-throughput runs
compile_cell: False # torch.compile (DEFAULT mode, fusion - NOT reduce-overhead, which is CUDA graphs) on the recurrent cell. CUDA-only: measured 1.39x on the world-model step, 1.01x on CPU. May reorder float ops, so curve-gate it
