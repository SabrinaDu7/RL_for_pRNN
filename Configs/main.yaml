defaults:
    - _self_
    - env: lroom # -> exp.*      (Configs/env/)
    - model: sr_ac # -> exp.*      (Configs/model/)
    - world_model: thrnn5win # -> predNet.* (Configs/world_model/)
    - algo: ppo # -> rl.*       (Configs/algo/)
    - rewards: curious_next_obs # -> rl.*       (Configs/rewards/)
    - tasks: omt
    - optional run: null # e.g. run=multienv; sets the whole shape of a named experiment
    - optional performance: null # e.g. performance=ultra; explicit because it changes optimizer batching semantics
    - override hydra/hydra_logging: disabled
    - override hydra/job_logging: disabled

# Groups compose into the historical key paths (exp / predNet / rl) via
# @package directives, so all call sites keep reading e.g. args.rl.lr.
# Swap components from the CLI: `algo=a2c rewards=curious_next_obs
# world_model=thrnn5win_prevact env=fourrooms model=plain_ac`.

hydra:
    output_subdir: null
    sweep:
        dir: .
        subdir: .
    run:
        dir: .

exp:
    exp_name: omt
    seed: 2 # Random seed
    num_envs: 8 # Parallel envs for rollout collection (1 = exact historical serial path; learning-equivalence gated by the 2026-07 bsweep, docs/perf_log.md). NOTE: exp.random_action_agent=true requires num_envs=1
    async_envs: False # num_envs>1 only: step envs in worker processes (AsyncVectorEnv). Off by default: measured no faster than the in-process list on dev box (+6-9%) or cluster (slower); transitions identical either way (tests/test_async_envs.py)
    intrinsic: False # Use intrinsic rewards?
    random_action_agent: False # If True, overrides PPO and chooses actions randomly. Used as control
    curious_agent: True # Use pRNN loss as reward?
    random_init_control: False # If True, never update parameters (random-init control)
    offpolicy_prnn_eval: False # prnn eval with off-policy actions (random if PPO, vice versa). Off by default since 2026-07: each pass costs 2 CPU rollouts of eval_timesteps
    onpolicy_prnn_eval: True # prnn eval with on-policy actions
    eval_trajs: 8 # spatial eval: pooled trajectories of predNet.seqdur steps each (matches training trajectory statistics)
    eval_timesteps: 15000 # LEGACY spatial-eval path only (eval_decoder=True): single-rollout length inside prnn
    eval_decoder: False # use prnn's legacy spatial eval (own rollout + 5000-batch decoder fit + prnn-internal logging)
    see_through_walls: null # null = env default (True). False = occlusion; needs its own main_train baseline
    new_obj_pos: null # [x, y] of a FloorBright object, or null for none. Only forwarded to envs that accept it (LRoom, SquareRoom)
    analyze_agent_behav: True # Policy/state analysis + mutual information logging

logging:
    wandb_log: True
    wandb_entity: blake-richards
    wandb_project: curious-george # curious-george-omt, curious-george-ctrl
    video_log_freq: 0 # Episodes between video logs (0: no videos)
    # Cadences are in ENVIRONMENT STEPS, not updates. An update is rl.frames
    # steps, which scales with exp.num_envs, so an update-counted interval
    # silently rescales with the rollout shape: under performance=ultra the
    # whole run is ~78 updates, and the old 120/200-update intervals never
    # fired at all. 0 disables the event. Defaults below reproduce the
    # historical cadence at the default rl.frames=2048.
    log_every_steps: 2048 # was log_interval=1 update
    plot_every_steps: 409600 # plotSampleTrajectory: a figure + GPU<->CPU model swap
    analysis_every_steps: 409600 # sRSA/SWdist + behaviour analysis (0: no analysis)
    save_every_steps: 245760 # rolling checkpoint, overwritten (0: don't save)
    archive_every_steps: 0 # ALSO keep a step-tagged copy under <run>/checkpoints/ (0: off). 3.2 MB each; this is the developmental series analysis reads
    early_stop: False # Stop when the environment is solved?
    save_params: True
    focus: False # Which parameter to include in the group name, or False
    load_acmodel: False
    load_worldmodel: False
