defaults:
    - _self_
    - env: lroom            # -> exp.*      (Configs/env/)
    - model: sr_ac          # -> exp.*      (Configs/model/)
    - world_model: thrnn5win # -> predNet.* (Configs/world_model/)
    - algo: ppo             # -> rl.*       (Configs/algo/)
    - rewards: curious      # -> rl.*       (Configs/rewards/)
    - tasks: omt
    - override hydra/hydra_logging: disabled
    - override hydra/job_logging: disabled

# Groups compose into the historical key paths (exp / predNet / rl) via
# @package directives, so all call sites keep reading e.g. args.rl.lr.
# Swap components from the CLI: `algo=a2c rewards=curious_next_obs
# world_model=thrnn5win_prevact env=fourrooms model=plain_ac`.

hydra:
  output_subdir: null
  sweep:
    dir: .
    subdir: .
  run:
    dir: .

exp:
    exp_name: omt
    seed: 2 # Random seed
    num_envs: 1 # Parallel envs for rollout collection (1 = exact historical serial path)
    intrinsic: False # Use intrinsic rewards?
    random_action_agent: False # If True, overrides PPO and chooses actions randomly. Used as control
    curious_agent: True # Use pRNN loss as reward?
    random_init_control: False # If True, never update parameters (random-init control)
    offpolicy_prnn_eval: True # prnn eval with off-policy actions (random if PPO, vice versa)
    onpolicy_prnn_eval: True # prnn eval with on-policy actions
    analyze_agent_behav: True # Policy/state analysis + mutual information logging

hardware:
    use_gpu: True
    which_gpu: 0 # GPU device code

logging:
    wandb_log: True
    wandb_entity: blake-richards
    wandb_project: curious-george # curious-george-omt, curious-george-ctrl
    video_log_freq: 0 # Episodes between video logs (0: no videos)
    log_interval: 1 # Updates between two logs
    plot_interval: 200 # Updates between plotSampleTrajectory figures (was implicitly log_interval=1: a figure + GPU<->CPU model swap EVERY update)
    analysis_interval: 200 # Updates between analysis events (0: no analysis)
    save_interval: 120 # Updates between two saves (0: don't save)
    early_stop: False # Stop when the environment is solved?
    save_params: True
    focus: False # Which parameter to include in the group name, or False
    load_acmodel: False
    load_worldmodel: False
