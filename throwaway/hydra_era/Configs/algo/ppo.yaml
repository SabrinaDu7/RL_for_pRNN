# @package rl
algo: ppo
loss: ppo_clip # curious_george.rl.update.losses.LOSSES key
# Run length, as the amount of EXPERIENCE to collect. Total environment steps
# are derived (episodes_total * predNet.seqdur = 20,480,000 by default), as are
# the update count and both optimizer-step budgets - see
# curious_george/training/schedule.py, which prints them at startup.
episodes_total: 80000 # trajectories of predNet.seqdur steps each
frames: 2048 # Frames collected per update (across all envs); must divide by exp.num_envs
trajs_per_batch: 8 # tasks/ only (OMT batch size); main_train derives its own from rl.frames
discount: 0.98
lr: 3e-4
optim_betas: [0.9, 0.999]
gae_lambda: 0.95 # Lambda in GAE (1 = no gae)
entropy_coef: 0.0
value_loss_coef: 1
max_grad_norm: 0.5
optim_eps: 1e-8
ppo_epochs: 4
ppo_batch_size: 256
ppo_clip_eps: 0.2
cuda_graph: False # CUDA-graph the PPO minibatch step (rl/update/policy_graph.py). One update is ppo_epochs*frames/ppo_batch_size gradient steps on a tiny actor-critic, i.e. almost pure dispatch: measured 3.558 -> 0.275 ms/step. Fresh runs only (Adam is rebuilt capturable, which needs empty state).
entropy_coef_final: null # if set, entropy_coef ramps LINEARLY to this over the run (training/schedule.py::EntropySchedule). Collapse is late, so a rising coefficient puts resistance where the drift is. null = constant.
